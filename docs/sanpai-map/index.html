@page{size:A4;margin:0}
:root{

}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{width:794px;height:1123px;padding:20px 28px 14px;font-family:var(--sans);color:var(--ink);
  display:flex;flex-direction:column;gap:8px;overflow:hidden;-webkit-print-color-adjust:exact;print-color-adjust:exact}
header{display:flex;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:8px}
header .org{font-size:13px;font-weight:600;letter-spacing:.08em;color:var(--sub)}
header h1{font-family:var(--serif);font-weight:900;font-size:33px;line-height:1.1;letter-spacing:.04em}
.view{font-size:12px;font-weight:600;border:1.5px solid var(--ink);border-radius:999px;padding:4px 12px;margin-bottom:4px;white-space:nowrap}
.map{flex:none;border:1px solid var(--line);border-radius:6px;overflow:hidden;line-height:0}
.map svg{width:100%;height:auto;display:block}
svg text{font-family:var(--sans)}
.flow{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700}
.flow span{display:flex;align-items:center;gap:5px;white-space:nowrap}
.flow b{flex:none;width:19px;height:19px;border-radius:50%;background:var(--c);color:#fff;font-size:12px;display:grid;place-items:center;line-height:1}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.step{border:1px solid var(--line);border-top:4px solid var(--c);border-radius:4px;background:#fff;padding:6px 8px 6px}
.step h2{display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:800;white-space:nowrap}
.step h2 b{flex:none;width:21px;height:21px;border-radius:50%;background:var(--c);color:#fff;font-size:13px;
  display:grid;place-items:center;line-height:1}
.step p,.note{word-break:auto-phrase;text-wrap:pretty}
.step p{font-size:10.6px;line-height:1.55;color:#33423C;margin-top:5px}
.step p em{font-style:normal;font-weight:700;color:var(--c)}
.notes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.note{font-size:10.8px;line-height:1.55;padding:5px 10px;border-left:4px solid var(--c);background:#F4F1E7;border-radius:0 4px 4px 0}
.note strong{color:var(--c);font-weight:800;margin-right:.6em}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.photos figure{position:relative}
.photos img{width:100%;aspect-ratio:720/262;object-fit:cover;display:block;border-radius:4px}
.photos figcaption{font-size:11.5px;font-weight:600;margin-top:4px;display:flex;align-items:center;gap:6px}
.tag{flex:none;width:18px;height:18px;border-radius:4px;background:var(--ink);color:#fff;font-size:11.5px;font-weight:800;
  display:grid;place-items:center;line-height:1}
.photos figcaption span{color:var(--sub);font-weight:500}
footer{margin-top:auto;border-top:1px solid var(--line);padding-top:6px;font-size:10px;color:var(--sub)}
</style>

<script>
// 順路の線に白フチと矢印を付ける
const NS='http://www.w3.org/2000/svg', g=document.getElementById('routes');
[...g.querySelectorAll('path.r')].forEach(p=>{
  const c=p.dataset.c, len=p.getTotalLength();
  const casing=p.cloneNode(); casing.removeAttribute('class');
  casing.setAttribute('stroke','#FBF9F1'); casing.setAttribute('stroke-width',10); casing.setAttribute('opacity','.95');
  g.insertBefore(casing,p);
  const w=+(p.dataset.w||5); casing.setAttribute('stroke-width',w+5);
  p.setAttribute('stroke',c); p.setAttribute('stroke-width',w);
  if(p.dataset.dash) p.setAttribute('stroke-dasharray',p.dataset.dash);
  (p.dataset.arrows||'').split(',').filter(Boolean).forEach(f=>{
    const l=len*parseFloat(f), a=p.getPointAtLength(Math.max(0,l-2)), b=p.getPointAtLength(Math.min(len,l));
    const ang=Math.atan2(b.y-a.y,b.x-a.x)*180/Math.PI;
    const t=document.createElementNS(NS,'path');
    t.setAttribute('d','M-9,-7.500L5,0L-9,7.500Z'); t.setAttribute('fill',c);
    t.setAttribute('stroke','#FBF9F1'); t.setAttribute('stroke-width',1.5); t.setAttribute('stroke-linejoin','round');
    t.setAttribute('transform',`translate(${b.x},${b.y}) rotate(${ang})`);
    g.appendChild(t);
  });
});
</script>
