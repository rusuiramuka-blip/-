<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>巫女管理</title>
<style>
:root{--green:#285b49;--light:#eaf3ed;--ink:#253b33;--muted:#69786f;--line:#dce3dc;--paper:#fff;--bg:#f4f5ef;--amber:#9a641c;--red:#a13d39}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);background:var(--bg);font:15px/1.6 system-ui,-apple-system,"Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}
button{cursor:pointer;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);padding:9px 14px;min-height:42px}
button:hover{background:var(--light);border-color:#9bbca8}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #7ba58a;outline-offset:2px}
button.primary{background:var(--green);color:white;border-color:var(--green)}
button.danger{color:var(--red)}
button:disabled{cursor:not-allowed;opacity:.55}
input,select,textarea{width:100%;border:1px solid #cbd5cc;background:white;border-radius:6px;padding:9px;color:var(--ink);min-height:42px}
input[type=checkbox]{width:19px;min-height:19px;accent-color:var(--green)}
textarea{min-height:88px;resize:vertical}
header{background:white;border-bottom:1px solid var(--line);padding:16px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
header b{font-size:23px;letter-spacing:.05em}
header small{margin-left:15px;color:var(--muted)}
nav{display:flex;gap:8px;background:white;padding:0 28px 16px;position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line)}
nav button{padding:11px 24px;background:#f1f3ed;border:0;font-weight:700;min-width:150px}
nav button[aria-current=page]{background:var(--green);color:white}
main{padding:22px 28px;max-width:1800px;margin:auto}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.bar .grow{flex:1}
.bar input,.bar select{width:auto;max-width:220px}
.bar h1{font-size:24px;margin:0 18px 0 0}
h2{font-size:20px;margin:0 0 10px}
h3{font-size:16px;margin:22px 0 10px}
.muted{color:var(--muted);font-size:13px}
.badge{display:inline-flex;padding:3px 9px;background:var(--light);border-radius:5px;font-size:12px;white-space:nowrap}
.badge.wait{background:#fff0d5;color:#885c1f}
.badge.closed{background:#edf0ed;color:#6d766f}
.badge.urgent{background:#fbe5e2;color:#963d34}
.badge.info{background:#e7f0fa;color:#355c86}
.next-action{font-weight:600;margin:7px 0;font-size:13px}
.contact-summary{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 18px}
.contact-summary button[aria-pressed=true]{border:2px solid var(--green);background:var(--light)}
.badge.purple{background:#f0eafa;color:#715192}
.notice{padding:12px 16px;background:#fff8e8;border:1px solid #e9d9b7;border-radius:7px;margin-bottom:16px}
.notice.error{background:#fff1ef;color:#953c35;border-color:#eccdc8}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:start}
.split.has-panel{grid-template-columns:minmax(420px,1fr) 420px}
.surface{background:white;border:1px solid var(--line);border-radius:10px;padding:18px}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:9px;background:white}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
th,td{padding:13px 14px;border-bottom:1px solid #e7ebe6;text-align:left;vertical-align:top}
th{background:#eff3ed;font-weight:600;white-space:nowrap;position:sticky;top:0;z-index:1}
tr:last-child td{border-bottom:0}
th.name,td.name{min-width:155px;white-space:nowrap}
.name button{border:0;background:none;padding:0;font-weight:700;color:var(--green);text-align:left}
.selected td{background:#f0f6ee}
.panel{background:white;border:1px solid var(--line);border-radius:10px;position:sticky;top:82px;max-height:calc(100vh - 250px);overflow:auto}
.panel-head{background:white;position:sticky;top:0;z-index:2;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:16px 18px}
.panel-head h2{font-size:19px;margin:0}
.panel-body{padding:0 18px 18px}
.panel-foot{position:sticky;bottom:0;background:white;border-top:1px solid var(--line);padding:14px 18px;display:flex;gap:8px;justify-content:flex-end}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fields label{display:block;font-size:13px;font-weight:600}
.fields label input,.fields label select,.fields label textarea{margin-top:4px}
.full{grid-column:1/-1}
.check{display:flex!important;align-items:center;gap:8px}
.steps{display:flex;gap:6px;margin:16px 0}
.steps button{flex:1;font-size:13px;white-space:nowrap}
.steps button.on{background:var(--light);border-color:#8cb29b}
.seat{display:block;width:100%;text-align:left;margin:5px 0;background:var(--light);border:1px solid #c8dfce;white-space:nowrap;font-weight:600}
.seat.empty{border-style:dashed;color:var(--amber);background:#fffaf0;font-weight:400}
.grid th:not(:first-child),.grid td:not(:first-child){min-width:165px}
.grid th:first-child,.grid td:first-child{position:sticky;left:0;min-width:130px;background:white;z-index:2}
.grid th{z-index:3}
.short{background:#fff8e9}
.count{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;margin-bottom:6px;color:var(--muted)}
.count button{padding:2px 6px;min-height:28px;font-size:12px}
.candidate{display:block;border:1px solid var(--line);border-radius:7px;padding:12px;margin:8px 0}
.candidate.disabled{background:#f4f5f3;color:#7a827b}
.candidate small{display:block;margin:4px 0}
.meal{background:#edf3e9;padding:10px 18px;border-radius:7px;font-size:17px;font-weight:700}
.venue{margin-bottom:20px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.attendance-card{border:1px solid var(--line);border-radius:9px;background:white;padding:16px}
.attendance-card b{font-size:18px}
.attendance-card button{width:100%;margin-top:12px}
.empty-state{text-align:center;padding:48px 24px;color:var(--muted)}
.totals{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.total{padding:12px;border:1px solid var(--line);border-radius:7px}
.total b{display:block;font-size:22px}
.total.net{grid-column:1/-1;background:var(--green);color:white}
.plain-list{padding:0;list-style:none}
.plain-list li{padding:8px 0;border-bottom:1px solid var(--line)}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);max-width:90%;padding:12px 22px;background:#253b33;color:white;border-radius:8px;z-index:30;display:none}
.save-state{margin-right:auto;align-self:center;font-size:13px;color:var(--muted)}
.save-state.pending{color:#885c1f;font-weight:600}
.panel-error:empty{display:none}.panel-error{padding:12px 18px 0}
#request-status{position:fixed;top:8px;left:50%;transform:translateX(-50%);z-index:60;padding:8px 18px;background:var(--green);color:white;border-radius:8px;box-shadow:0 2px 8px #0002}
#busy{position:fixed;top:0;left:0;width:100%;height:4px;background:#91b79c;z-index:50;display:none}
.print-only{display:none}
.hint{padding:12px;background:#f1f5ed;border-radius:6px;font-size:13px}
.form-source{white-space:pre-wrap;max-height:180px;overflow:auto;font-size:13px;background:#f6f7f2;padding:10px;border-radius:6px}
.cash{display:flex;flex-wrap:wrap;gap:8px}
.cash span{padding:7px 12px;background:#eff3eb;border-radius:5px}
.link{color:var(--green);text-decoration:underline}
.alert-link{border:0;background:transparent;padding:0;color:var(--amber)}

.mail-layout{display:grid;grid-template-columns:minmax(260px,1fr) minmax(420px,1.8fr);gap:28px}.mail-layout fieldset{border:0;padding:0;margin:0}.mail-layout textarea[name="mailBody"],.mail-layout textarea[name="本文"]{min-height:380px}.template-list{display:grid;gap:7px}.template-list button{text-align:left}.template-list button[aria-pressed=true]{background:var(--light);border-color:var(--green);font-weight:700}.mail-tools{margin-top:15px}#mail-client:not([href]){color:var(--muted);pointer-events:none}
@media(max-width:760px){.mail-layout{display:block}.mail-layout>section{margin-bottom:24px}}
.interview-workspace .panel{position:relative;top:auto;max-height:none;overflow:visible}
.interview-workspace .panel-head{position:static}
.interview-workspace .panel-body{padding:0 22px 110px}
.interview-layout{display:grid;grid-template-columns:minmax(300px,1fr) minmax(420px,1.4fr);gap:24px}
.interview-source{background:#f3f6f9;border:1px solid #d9e2ea;padding:0 16px 16px;border-radius:8px;align-self:start;position:sticky;top:130px;max-height:calc(100vh - 230px);overflow:auto}
.interview-source .form-source{background:white;max-height:none}
.source-head{position:sticky;top:0;z-index:1;background:#f3f6f9;display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:12px 0 10px;border-bottom:1px solid #d9e2ea;margin-bottom:12px}
.source-head h3{margin:0;flex:1;white-space:nowrap}
.source-head button{min-height:32px;padding:3px 10px;font-size:13px}
.answers{margin:0}
.answer{padding:7px 0;border-bottom:1px solid #dde4ea}
.answer:last-child{border-bottom:0}
.answer dt{font-size:12px;color:var(--muted);line-height:1.4;margin-bottom:1px}
.answer dd{margin:0;font-size:15px;white-space:pre-wrap;overflow-wrap:anywhere}
.answer.long dd{background:white;padding:8px 10px;border-radius:6px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tags .badge{font-size:14px;padding:4px 10px;font-weight:600;white-space:normal}
.choice-table{width:100%;margin:6px 0 12px;font-size:13px}
.choice-table th,.choice-table td{padding:5px 0;border-bottom:1px solid #dde4ea;background:none;position:static;vertical-align:top}
.choice-table tr:last-child>*{border-bottom:0}
.choice-table th{width:5.5em;padding-right:8px;color:var(--muted);white-space:nowrap}
.chip{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:5px;font-size:13px;white-space:normal;overflow-wrap:anywhere}
.chip.yes{background:#dcefe2;color:#1f5a3c;font-weight:700}
.chip.no{background:#f1f1ee;color:#69786f;text-decoration:line-through}
.chip.ask{background:#ffe9b8;color:#7a4f12;font-weight:700}
.chip.ng{background:#f6e3e1;color:#963d34;font-weight:700}
.chip.unk{background:#f1f1ee;color:var(--muted)}
.consult{background:#fff6d6;border:2px solid #e8c95a;border-radius:8px;padding:10px 12px;margin:10px 0 12px}
.consult b{display:block;font-size:13px;color:#7a4f12}
.consult p{margin:4px 0;white-space:pre-wrap;overflow-wrap:anywhere;font-weight:600}
.consent-ok{font-size:13px;color:#1f5a3c;margin:0 0 10px}
.all-answers summary{cursor:pointer;font-weight:600;font-size:14px;padding:6px 0;color:var(--green)}
.form-ref{background:#f3f6f9;border-left:4px solid #8aa6bf;border-radius:6px;padding:8px 12px;margin-bottom:4px}
.form-ref-title{font-size:12px;color:var(--muted);font-weight:600}
.form-ref dl{margin:2px 0 0}
.form-ref dt{font-size:12px;color:var(--muted);font-weight:400}
.form-ref dd{margin:0 0 4px;white-space:pre-wrap;font-weight:600;font-size:14px}
.quick-fee{display:flex;flex-wrap:wrap;gap:6px;align-items:flex-start}
.quick-fee>button{min-height:34px;padding:4px 12px}
.quick-fee .form-ref{flex-basis:100%}
.interview-source.large .answer dt{font-size:14px}
.interview-source.large .consult p,.interview-source.large .chip,.interview-source.large .tags .badge{font-size:17px}
.interview-source.large .answer dd{font-size:19px}
.interview-layout>*{min-width:0}.interview-pane h3:first-child{margin-top:0}
.quick-fee button[aria-pressed=true]{background:var(--light);border-color:var(--green);font-weight:700}
.wish-choices{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 16px}
.wish-choices button{font-size:14px;padding:7px 12px}
.wish-choices button[aria-pressed=true]{background:var(--green);border-color:var(--green);color:white;font-weight:700}
.wish-month{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 8px}
.wish-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.wish-weekday{text-align:center;font-size:12px;color:var(--muted);padding:3px}
.wish-date{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:64px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:#fff}
.wish-date:has(input:checked){background:#e2f0e8;border:2px solid var(--green)}
.wish-date:has(input:focus-visible){outline:3px solid #669bd1;outline-offset:1px}
.wish-date input{width:17px;height:17px;min-height:0;margin:0;accent-color:var(--green);vertical-align:middle}
.wish-date>span{font-weight:700;font-size:15px;white-space:nowrap}
.wish-date small{font-size:11px;padding:1px 4px;border-radius:4px}
.wish-date .yes{background:#e2f0e8;color:#225e43}.wish-date .no{background:#f9e3df;color:#993e30}.wish-date .ask{background:#fff1cb;color:#79510c}
.wish-date:has(input:disabled){background:#f6f7f6;color:#8b918e;cursor:default}
.wish-tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.wish-tools button{min-height:34px;padding:5px 10px;font-size:13px}
.wish-savebox{background:#f3f7f4;border:1px solid #d5e2d9;border-radius:8px;padding:12px;margin:12px 0 20px}
.wish-savebox p{margin:4px 0 10px}.wish-savebox button{width:100%}
.wish-records{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.wish-records .plain-list{max-height:220px;overflow:auto}
@media(max-width:480px){.wish-calendar{gap:3px}.wish-date>span{font-size:13px}.wish-date small{font-size:10px;padding:1px}.wish-date input{width:14px;height:14px}.wish-choices button{font-size:12px;padding:6px 8px}}
.interview-pane[hidden]{display:none}
.interview-workspace .steps{position:sticky;top:70px;background:white;z-index:3;padding:10px 0;flex-wrap:wrap}
.interview-workspace .steps button{white-space:normal}
.interview-workspace .panel-foot{position:fixed;bottom:0;left:28px;right:28px;z-index:6;flex-wrap:wrap;border:1px solid var(--line);box-shadow:0 -3px 12px #00000008}
.interview-workspace textarea{min-height:110px}
@media(max-width:850px){.interview-layout{display:block}.interview-source{position:static;max-height:45vh;margin-bottom:18px}}
@media(max-width:760px){.interview-workspace .panel{position:relative;inset:auto}.interview-workspace .panel-foot{position:fixed;left:0;right:0}.interview-workspace .steps{top:60px}.interview-workspace .panel-body{padding:0 14px 160px}}
@media(max-width:480px){.interview-workspace .fields{grid-template-columns:1fr}.interview-workspace .panel-foot button{padding:8px;font-size:13px}.interview-workspace .steps button{flex-basis:44%}.interview-source{padding:0 12px 12px}}
@media(max-width:1000px){.split.has-panel{grid-template-columns:minmax(300px,1fr) 370px}
nav button{min-width:0;flex:1;padding:10px 8px}
header,main{padding:16px}
nav{padding:0 16px 12px}
.fields{gap:9px}
}
@media(max-width:760px){.split.has-panel{display:block}
.panel{position:fixed;inset:0;z-index:20;max-height:none;border-radius:0}
.bar h1{width:100%}
header small{display:none}
.panel-head{top:0}
.panel-body{padding-bottom:90px}
.panel-foot{position:fixed;bottom:0;left:0;right:0}
th,td{padding:10px}
.grid td{min-width:140px}
.bar select{max-width:170px}
}
@media print{body{background:white;color:black}
header,nav,main,#toast,#busy{display:none!important}
.print-only{display:block!important;font-size:12px}
.print-only h1{font-size:22px}
.print-only th,.print-only td{border:1px solid #999;padding:8px;position:static}
.print-only table{border-collapse:collapse}
.receipt{page-break-after:always}
.receipt:last-child{page-break-after:auto}
}


.juban-box{min-width:0;margin:0;padding:16px;border:1px solid #d9e2ea;border-radius:8px;background:#f7faf9}
.juban-box legend{padding:0 6px;font-size:17px;font-weight:700}
.juban-options{display:flex;flex-wrap:wrap;gap:10px}
.juban-options .juban-option{display:flex;align-items:center;gap:8px;min-height:44px;padding:10px 14px;border:1px solid #c6d2cb;border-radius:6px;background:white;cursor:pointer}
.juban-option:has(input:checked){background:#e5f1e9;border-color:#285b49;color:#183b2d;font-weight:700}
.juban-option input[type=radio]{width:18px;height:18px;margin:0;accent-color:#285b49}
.juban-option:focus-within{outline:2px solid #285b49;outline-offset:2px}
.juban-fee{margin:16px 0 8px;font-size:16px}.juban-fee strong{font-size:21px;color:#7d3c0a}
.juban-summary{padding:12px;background:#f3f6f9;border-radius:6px;line-height:1.7}

/* Shared venue timeline. Times and groups are derived from registered bands. */
.shift-views{flex-wrap:wrap;margin:0}
.shift-board{min-width:0}
.sb-venue,.sb-place-list{scroll-margin-top:90px}
.sb-intro{font-size:14px;margin:0 0 14px}
.sb-intro .muted{display:block;margin-top:3px}
.sb-place-list{margin-bottom:20px;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:white}
.sb-places-head,.sb-place-row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) 160px;gap:14px;align-items:center;padding:10px 14px}
.sb-places-head{font-size:12px;color:var(--muted);background:#eff3ed}
.sb-place-row{border-top:1px solid var(--line)}
.sb-place-row.active{background:var(--light)}
.sb-place-row>button{white-space:normal;text-align:left;overflow-wrap:anywhere;font-weight:600}
.sb-place-row>button[aria-pressed=true]{border-color:#8cb29b;background:white;color:var(--green)}
.sb-place-bands{display:flex;gap:7px 20px;flex-wrap:wrap;font-size:13px;font-variant-numeric:tabular-nums}
.sb-place-bands>span{display:block}
.sb-place-bands em{font-style:normal;color:#98451e}
.sb-place-status{font-size:13px}
.sb-warning{color:#98451e;display:block}
.sb-venue{background:white;border:1px solid var(--line);border-radius:9px;padding:18px;min-width:0}
.sb-venue-title{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.sb-venue-title h2{font-size:20px;margin:0}
.sb-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px;margin-bottom:15px}
.sb-group{display:flex;flex-direction:column;gap:3px;padding:12px 14px;background:#f0f4ef;border-radius:6px;font-size:13px}
.sb-group strong{font-size:16px}
.sb-group-count{font-weight:600}
.sb-group-empty{background:#fff5e7}
.sb-previous{padding:10px 12px;margin:0 0 16px;background:#f2f5ef;border-radius:6px}
.sb-previous>summary,.sb-slot-details>summary{cursor:pointer;min-height:36px;font-size:14px;font-weight:600;padding:5px 0}
.sb-previous>summary:focus-visible,.sb-slot-details>summary:focus-visible{outline:3px solid #7ba58a;outline-offset:2px}
.sb-previous[open]>.sb-scope{background:white;padding:14px;margin-top:10px;border-radius:6px}
.sb-legend{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:10px 0}
.sb-legend>span{display:flex;gap:6px;align-items:center}
.sb-legend i{display:inline-block;width:18px;height:12px;background:#d8ebde;border-radius:2px}
.sb-legend i.rest{background:repeating-linear-gradient(135deg,#f3d9a8,#f3d9a8 4px,#ac7d32 4px,#ac7d32 5px)}
.sb-legend i.empty{background:white;border:1px dashed #9a641c}
.sb-timehead,.sb-person-row{display:grid;grid-template-columns:190px minmax(0,1fr);gap:16px}
.sb-timehead{align-items:end;margin-bottom:5px}
.sb-axis{position:relative;height:23px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sb-tick{position:absolute;transform:translateX(-50%);white-space:nowrap}
.sb-tick.first{transform:none}.sb-tick.last{transform:translateX(-100%)}
.sb-person-row{align-items:center;padding:11px 0;border-top:1px solid var(--line);min-height:78px}
.sb-person-row>div{min-width:0}
.sb-person-label .seat{margin:0 0 4px;width:auto;max-width:100%;white-space:normal;overflow-wrap:anywhere}
.sb-person-hours{display:block;font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted)}
.sb-person-label .badge{margin-top:3px}
.sb-track{height:29px;position:relative;border-radius:4px;background:#f0f3ed}
.sb-work,.sb-vacant,.sb-absent,.sb-uncertain{position:absolute;top:0;height:29px;border-radius:4px;overflow:hidden}
.sb-work{background:#d8ebde}.sb-absent{background:#e1e4e0;color:#646e66}.sb-uncertain{background:#f2dfbe}
.sb-vacant{border:1px dashed #a37d39;background:#fff7e9;color:#8c5a1f}

@media(max-width:760px){.sb-venue{padding:13px}.sb-places-head{display:none}.sb-place-row{grid-template-columns:100px minmax(0,1fr);gap:5px 10px;padding:10px}.sb-place-status{grid-column:2}.sb-place-bands{display:block}.sb-place-bands>span{margin-bottom:4px}.sb-groups{grid-template-columns:1fr}.sb-group{padding:10px 12px}.sb-timehead{grid-template-columns:1fr;gap:4px}.sb-timehead>span{display:none}.sb-person-row{grid-template-columns:1fr;gap:5px}.sb-person-label{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.sb-person-label .seat{margin:0}.sb-relief-row{grid-template-columns:1fr 1fr;gap:5px 12px}.sb-relief-row.head{display:none}.sb-relief-row>div:first-child{font-weight:600}.sb-relief-row>div:nth-child(4){grid-column:2;grid-row:1;text-align:right}.sb-relief-row>div:nth-child(2),.sb-relief-row>div:nth-child(3){grid-row:2}.sb-mobile-label{display:block;font-size:11px;color:var(--muted)}.sb-previous[open]>.sb-scope{padding:8px}.shift-views button{white-space:normal}}

</style></head><body>
<div id="busy" aria-label="処理中"></div><div id="request-status" role="status" hidden>処理中です。少々お待ちください…</div><header><div><b>巫女管理</b><small id="site"></small></div><div><span id="mode" class="badge"></span> <button data-action="templates">メールテンプレート</button> <button data-action="settings" aria-label="設定">⚙ 設定</button></div></header>
<nav aria-label="業務"><button data-action="nav" data-tab="people" aria-current="page">① 名簿と採用</button><button data-action="nav" data-tab="shift">② シフト</button><button data-action="nav" data-tab="today">③ 当日</button><button data-action="nav" data-tab="pay">④ 精算</button></nav>
<main><div id="errors" role="alert"></div><div id="content"><div class="surface">台帳を読み込んでいます…</div></div></main><div id="toast" role="status"></div><div id="print" class="print-only"></div>
<script>
'use strict';
let S=null,tab='people',day='',view='overview',panel=null,filter='all',query='',saving=false,dirty=false,calculation=null,settingTable='設定',contactFilter='all',answersLarge=false,pendingRequests=0;
try{answersLarge=localStorage.getItem('answersLarge')==='1';}catch(e){}
const $=x=>document.querySelector(x),E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const B=(label,action,extra='',primary=false)=>`<button data-action="${action}" ${extra}${primary?' class="primary"':''}>${E(label)}</button>`;
const yes=v=>v===true||v==='true'||v==='TRUE'||v==='済'||v==='はい';
const yen=v=>Number(v||0).toLocaleString('ja-JP')+'円';
const get=(t,k,id)=>S[t].find(r=>r[k]===id)||{};
const name=(t,k,id,label)=>get(t,k,id)[label]||id;
const person=id=>get('人','人ID',id);
const band=id=>get('勤務帯','勤務帯ID',id);
const venue=id=>get('売場','売場ID',id);
const status=s=>`<span class="badge ${s==='採用'||s==='出勤'?'':s==='不採用'||s==='辞退'||s==='取消'?'closed':s==='面接予定'?'purple':'wait'}">${E(s)}</span>`;
const plus=(d,n)=>new Date(Date.parse(d+'T00:00:00Z')+n*86400000).toISOString().slice(0,10);
const days=(a,b)=>{const r=[];for(let d=a;d<=b;d=plus(d,1))r.push(d);return r;};
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',4500);}
function error(e){const el=$('.panel-error')||$('#errors');el.innerHTML=`<div class="notice error">${E(e.message||e)}</div>`;el.focus({preventScroll:true});el.scrollIntoView?.({block:'nearest'});}
async function request(action,data){
 const controls=[...document.querySelectorAll('button,input,select,textarea')].map(el=>[el,el.disabled]);
 pendingRequests++;controls.forEach(([el])=>el.disabled=true);document.body.setAttribute('aria-busy','true');$('#request-status').hidden=false;
 try{return await new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).api(action,data||{}));}
 finally{pendingRequests--;controls.forEach(([el,disabled])=>{if(el.isConnected)el.disabled=disabled;});if(!pendingRequests){document.body.removeAttribute('aria-busy');$('#request-status').hidden=true;}}
}
async function load(){try{S=await request('load');day=day||S.cfg.期間開始;render();}catch(e){error(e);}}
async function save(action,data){if(saving)return;saving=true;$('#busy').style.display='block';try{S=await request(action,data);dirty=false;panel=null;calculation=null;render();toast('保存しました');return true;}catch(e){error(e);return false;}finally{saving=false;$('#busy').style.display='none';}}
function leave(){if(pendingRequests||saving)return false;updateInterviewState();if(dirty&&!confirm('保存していない内容があります。閉じますか？'))return false;dirty=false;panel=null;calculation=null;return true;}
function field(k,label,value='',type='text',full=false,options){if(type==='datetime-local'&&/^\d{4}-\d{2}-\d{2}$/.test(String(value)))type='date';const attrs=`name="${E(k)}"`;return `<label class="${full?'full':''}">${E(label)}${options?`<select ${attrs}>${options.map(x=>{const a=Array.isArray(x)?x:[x,x];return `<option value="${E(a[0])}" ${String(a[0])===String(value)?'selected':''}>${E(a[1])}</option>`;}).join('')}</select>`:type==='textarea'?`<textarea ${attrs}>${E(value)}</textarea>`:`<input ${attrs} type="${type}" value="${E(value)}" ${type==='number'?( ['gross','tax','deduction'].includes(k)?'step="1"':'min="0" step="1"'):''}>`}</label>`;}
function bandOptions(){return [['','選んでください'],...S.勤務帯.slice().sort((a,b)=>Number(a.並び順)-Number(b.並び順)).map(b=>[b.勤務帯ID,b.名前+' '+b.開始+'〜'+(yes(b.翌日終了)?'翌':'')+b.終了])];}
function rowForm(){const row=Object.fromEntries(new FormData($('#editor'))),check=$('[name="襦袢費用説明"]');if(check)row.襦袢費用説明=row.襦袢==='貸出'&&check.checked?'説明済み':'';return row;}
function panelHTML(title,body,foot=''){return `<aside class="panel" aria-label="${E(title)}"><div class="panel-head"><h2>${E(title)}</h2>${B('閉じる','close')}</div><div class="panel-error" role="alert" tabindex="-1"></div><form id="editor"><div class="panel-body">${body}</div>${foot?`<div class="panel-foot">${foot}</div>`:''}</form></aside>`;}
function render(){
 $('#errors').innerHTML='';$('#site').textContent=S.cfg.拠点名||'';$('#mode').textContent=S.cfg.運用モード==='確認用'?'確認用':'職員用';
 document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===tab?'page':'false'));
 const main=tab==='people'?peopleView():tab==='shift'?shiftView():tab==='today'?todayView():payView();
 $('#content').innerHTML=main;renderPanel();
}
function wrap(bar,body){if(['interview','mail','templates','mailHistory'].includes(panel?.kind))return '<div class="interview-workspace"><div id="panel-mount"></div></div>';return bar+`<div class="split ${panel?'has-panel':''}"><section>${body}</section><div id="panel-mount"></div></div>`;}
function legacyNotice(p,key){const line=String(p.面接メモ||'').split('\n').find(x=>x.startsWith(key+'：'));return line?line.slice(key.length+1).trim():'';}
const applicationContactStates=['未確認','返信が必要','本人返信待ち','確定案内待ち','連絡済み','追加連絡不要'];
function applicationContact(p){
 const method=p.応募連絡方法||legacyNotice(p,'interviewNoticeMethod');
 const date=p.応募連絡日||legacyNotice(p,'interviewNoticeOn');
 const state=p.応募連絡状況||((method&&date)?'連絡済み':'未確認');
 const adjusting=state==='本人返信待ち'||state==='確定案内待ち';
 const target=p.応募連絡対象日時||(p.応募連絡状況?'':legacyNotice(p,'interviewNoticeFor'));
 const stale=Boolean(target&&target!==p.面接日時&&(adjusting||['連絡済み','追加連絡不要'].includes(state)));
 const labels={'未確認':'応募返信の記録なし','返信が必要':'応募返信待ち','本人返信待ち':'面接日時の再調整・本人返信待ち','確定案内待ち':'本人返信あり・確定案内待ち','連絡済み':target?'面接案内済み':'連絡済み','追加連絡不要':'追加連絡不要'};
 const label=stale?(adjusting?'面接日時変更・確定案内を確認':'面接日時変更・連絡を確認'):labels[state];
 const tone=stale||state==='返信が必要'||state==='確定案内待ち'?'urgent':state==='未確認'||state==='本人返信待ち'?'wait':'';
 return {state,method,date,target,stale,adjusting,label,tone,need:stale||adjusting||['未確認','返信が必要'].includes(state)};
}
function hiringProgress(p){
 const c=applicationContact(p),decided=['採用','不採用'].includes(p.状態);
 const conveyed=p.採否伝達方法&&p.採否伝達方法!=='未連絡'&&(!p.採否伝達結果||p.採否伝達結果===p.状態);
 const accepted=p.状態==='採用'&&yes(p.本人承諾)&&!p.採否伝達方法;
 const outcomePending=decided&&!conveyed&&!accepted;
 const contactKeys={'返信が必要':'reply','本人返信待ち':'applicantReply','確定案内待ち':'confirmNotice'};
 let label=c.label,tone=c.tone,detail=[c.stale&&c.adjusting?c.state:'',c.date,c.method].filter(Boolean).join(' ／ '),need=c.need,key=contactKeys[c.state]||'check';
 if(decided){label=conveyed?'採否連絡済み（'+p.採否伝達方法+'）':accepted?'採用承諾済み':'採否の連絡待ち';tone=outcomePending?'urgent':'';detail=conveyed?(p.採否伝達日||'日付未記録'):accepted?'本人の承諾記録あり':'';need=outcomePending;key='result';}
 if(p.状態==='辞退'){label='対応終了';tone='closed';detail='';need=false;}
 let next='面接日時を決める',action='person';
 if(p.状態==='辞退'||p.状態==='不採用'&&!need){next='対応終了';action='contact';}
 else if(need){
  action='contact';
  if(outcomePending)next='採否を伝えて記録';
  else if(c.state==='本人返信待ち')next=c.stale?'本人の返信と変更後の日時を確認':'本人の返信を確認';
  else if(c.state==='確定案内待ち')next=p.面接日時?'確定した面接日時を伝えて記録':'面接日時を記録して確定案内';
  else next=c.state==='返信が必要'?'応募へ返信して記録':'連絡状況を確認・記録';
 }
 else if(p.状態==='採用'){next=!yes(p.本人承諾)?'本人の返事を確認':!p.生年月日||!p.区分?'生年月日・区分を記録':!Number(p.本番時給)||p.交通費===''||p.交通費==null?'時給・交通費を確認':!S.勤務希望.some(w=>w.人ID===p.人ID&&w.可否==='可')?'勤務できる日時を記録':'シフトへ配置できます';}
 else if(p.面接完了日){next='採否を決める';action='interview';}
 else if(p.面接日時){next=p.面接日時<S.now?'面接結果を記録':'面接を行う';action='interview';}
 let selection=p.状態;
 if(!decided&&p.状態!=='辞退'){
  if(p.面接完了日)selection='面接済み・選考中';
  else if(c.adjusting)selection='面接日時を調整中';
  else if(p.状態==='応募'&&p.面接日時)selection='面接予定';
 }
 return {label,tone,detail,need,key,next,action,selection};
}
function contactBadge(h){return `<span class="badge ${h.tone}">${E(h.label)}</span>`;}
function peopleView(){
 const fresh=S.フォーム回答.filter(r=>!r.人ID),hired=S.人.filter(p=>p.状態==='採用').length,progress=new Map(S.人.map(p=>[p.人ID,hiringProgress(p)])),pending=[...progress.values()].filter(h=>h.need);
 const bar=`<div class="bar"><h1>名簿と採用</h1><span class="badge">応募 ${S.人.length}名</span><span class="badge">採用 ${hired}名</span><span class="grow"></span>${B('更新','reload')}${B('新しく登録','newPerson','',true)}</div>`;
 const filterButtons=[['all','全員',S.人.length],['reply','応募への返信が必要',pending.filter(h=>h.key==='reply').length],['applicantReply','本人返信待ち',pending.filter(h=>h.key==='applicantReply').length],['confirmNotice','確定案内待ち',pending.filter(h=>h.key==='confirmNotice').length],['result','採否の連絡待ち',pending.filter(h=>h.key==='result').length],['check','連絡の記録確認',pending.filter(h=>h.key==='check').length]].map(([key,label,n])=>B(label+' '+n+'名','contactFilter',`data-filter="${key}" aria-pressed="${contactFilter===key}"`)).join('');
 let rows=S.人.filter(p=>(filter==='all'||p.状態===filter)&&(contactFilter==='all'||progress.get(p.人ID).need&&progress.get(p.人ID).key===contactFilter)&&(!query||(p.氏名+' '+p.ふりがな).includes(query))).slice().sort((a,b)=>(a.面接日時||'9999').localeCompare(b.面接日時||'9999')||a.ふりがな.localeCompare(b.ふりがな,'ja'));
 const controls=`<div class="hint bar">${S.reception?.connected?'応募フォーム受信：'+E(S.reception.mode||'接続済み')+(S.reception.last?' ／ 最終確認 '+E(S.reception.last.replace('T',' ')):''):'応募フォーム：自動受信は未接続（手動反映分を表示中）'}${S.user.admin&&S.reception?.connected?B('新しい回答を確認','pollForm'):''}</div>${S.cfg.移行元台帳?'<p class="hint">応募フォームの回答は自動受信します。旧版で変更した面接・採否は自動反映されません。面接・採否の入力はこの管理画面にまとめてください。</p>':''}${fresh.length?`<div class="notice">新しい応募 ${fresh.length}件 ${B('取り込む','import','',true)}</div>`:''}<div class="contact-summary" aria-label="連絡状況で絞り込む">${filterButtons}</div><div class="bar"><input id="search" aria-label="氏名を探す" placeholder="氏名・ふりがな" value="${E(query)}"><select id="statusFilter" aria-label="採用状況"><option value="all">全員</option>${['応募','面接予定','採用','不採用','辞退'].map(x=>`<option ${filter===x?'selected':''}>${x}</option>`).join('')}</select>${B('採用者だけ','hired')}<span class="muted">赤：連絡が必要　黄：返信待ち・記録を確認　緑：連絡済み・不要</span></div>`;
 const table=`<div class="table-wrap"><table><thead><tr><th class="name">氏名</th><th>選考状況・面接日時</th><th>連絡状況</th><th>次にすること</th></tr></thead><tbody>${rows.map(p=>{const h=progress.get(p.人ID);return `<tr class="${panel?.id===p.人ID?'selected':''}"><td class="name">${B(p.氏名,'person',`data-id="${E(p.人ID)}"`)}<div class="muted">${E(p.区分||'区分未登録')}</div><span class="badge ${p.経験==='あり'||String(p.経験).includes('経験あり')?'info':'closed'}">${E(p.経験==='あり'||String(p.経験).includes('経験あり')?'当山経験あり':p.経験==='なし'||p.経験==='未経験'?'未経験':'経験未確認')}</span></td><td>${status(h.selection)}<div class="muted">${E(p.面接日時?(h.selection==='面接日時を調整中'?'登録日時：':'')+p.面接日時.replace('T',' '):'面接日時未定')}</div>${B('面接を開く','interview',`data-id="${E(p.人ID)}"`)}</td><td>${contactBadge(h)}<div class="muted">${E(h.detail)}</div>${B('連絡を記録','contact',`data-id="${E(p.人ID)}"`)}</td><td><div class="next-action">${E(h.next)}</div>${B(h.action==='interview'?'面接を開く':h.action==='contact'?'確認・記録を開く':'本人カードを開く',h.action,`data-id="${E(p.人ID)}"`,h.next!=='対応終了')}</td></tr>`;}).join('')||'<tr><td colspan="4" class="empty-state">該当する方はいません。</td></tr>'}</tbody></table></div>`;
 return wrap(bar,controls+table);
}
function resultFields(p){return `<div class="fields">${field('採否伝達方法','採否の伝え方',p.採否伝達方法||'','text',false,[['','未記録'],'未連絡','その場で口頭','電話','メール','その他'])}${field('採否伝達日','伝えた日（空欄なら保存日）',p.採否伝達日,'date')}</div><p class="muted">その場で伝えたら「その場で口頭」を選びます。採否メールは不要です。保存だけではメールは送られません。</p>`;}
function contactPanel(){
 const p=panel.row,c=applicationContact(p),h=hiringProgress(p);
 const currentState=c.stale&&!c.adjusting?'返信が必要':c.state;
 const instructions=c.adjusting?'本人から返信が届いたら、面接日時を入力し「確定案内待ち」で保存してください。電話などで確定日時を伝えたら「連絡済み」を選びます。':'フォームの案内どおりで追加の連絡が要らない場合は「追加連絡不要」を選んでください。';
 const interviewDate=c.adjusting?field('面接日時','登録中の面接日時',p.面接日時,'datetime-local',true):'';

function shiftBoardGroupCard(g,scope){

function shiftBoardScope(scope,previous=false){

const LEGACY_CODE=/^(interviewOutcome|followup\w*|checked(At|By)|communication|workUnderstanding|scheduleFit|interviewNotice\w*|interviewSheet \/ .*|issuedOn|parentConsent|schoolConfirmation|note)：/;
function splitCodes(v){const human=[],codes=[];String(v||'').split('\n').forEach(l=>(LEGACY_CODE.test(l)?codes:human).push(l));return {human:human.join('\n').trim(),codes:codes.join('\n')};}

const ANSWER_GROUPS=[['school',/保護者|学校.*確認/],['consent',/身だしなみ|服装|携帯|スマートフォン|電卓|同意|確認事項/],['basic',/氏名|ふりがな|生年月日|メール|電話|住所|^区分|面接日|面接時刻|面接開始/],['experience',/経験|応募経路|きっかけ|募集を知/],['commute',/通勤/],['night',/深夜|23:00|夜勤/],['training',/研修/],['period',/期間|^勤務可能日$/],['band',/時間帯/],['wish',/勤務|希望/],['note',/連絡|質問|要望|備考|相談|^$/]];

function mailList(){return (S.メール文面||[]).slice().sort((a,b)=>Number(a.並び順)-Number(b.並び順));}
function mailAllowed(t,p){return yes(t.有効)&&(!t.対象||t.対象.split('／').includes(p.状態));}
function mailKeys(text){return [...new Set((String(text).match(/\{\{[^{}\n]+\}\}/g)||[]).map(x=>x.slice(2,-2)))];}
function mailContextKeys(){return ['氏名','募集年','面接日時','面接持参品','寺院名','電話','所在地','面接場所','勤務予定','本番時給','交通費'];}

function mailCheck(){const f=rowForm(),missing=mailKeys(f.mailSubject+'\n'+f.mailBody),m=panel.mail;let problem=missing.length?'未入力：'+missing.join('、'):!f.mailSubject?.trim()||!f.mailBody?.trim()?'件名・本文を入力してください。':f.mailSubject.length>180||/[\r\n]/.test(f.mailSubject)||f.mailBody.length>10000?'件名・本文の長さを確認してください。':panel.valuesDirty?'差し替えを本文に反映してください。':'';const address=/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(f.mailTo)&&f.mailTo.toLowerCase()===String(panel.row.メール).toLowerCase();if(!problem&&!address)problem='本人カードのメールアドレスを確認してください。';if(!problem&&['interview','reminder'].includes(m.template.テンプレートID)&&!panel.row.面接日時)problem='面接日時を本人カードに記録してください。';return {f,problem,address};}

 if(panel?.kind==='interview'&&['iwBand','iwDay'].includes(e.target.name)){const b=band($('[name="iwBand"]').value),d=$('[name="iwDay"]').value;if(b.開始&&d){$('[name="iwStart"]').value=d+'T'+b.開始;$('[name="iwEnd"]').value=plus(d,yes(b.翌日終了)?1:0)+'T'+b.終了;}}
 if(panel?.kind==='wish'&&['勤務帯ID','wishDay'].includes(e.target.name)){const b=band($('[name="勤務帯ID"]').value),d=$('[name="wishDay"]').value;if(b.開始&&d){$('[name="開始日時"]').value=d+'T'+b.開始;$('[name="終了日時"]').value=plus(d,yes(b.翌日終了)?1:0)+'T'+b.終了;}}
});
document.addEventListener('change',()=>updateInterviewState());
document.addEventListener('keydown',e=>{if(saving||pendingRequests)return;if(e.target.id==='search'&&e.key==='Enter')e.preventDefault();if(e.key==='Escape'&&panel&&leave())render();});
document.addEventListener('click',async e=>{
 const btn=e.target.closest('[data-action]');if(!btn||btn.disabled||saving||pendingRequests)return;e.preventDefault();const a=btn.dataset.action,id=btn.dataset.id;
 try{

 if(a==='templates'){if(leave()){panel={kind:'templates',row:mailList()[0]};render();window.scrollTo(0,0);}return;}
 if(a==='selectMailTemplate'){if(leave()){panel={kind:'templates',row:structuredClone(get('メール文面','テンプレートID',id))};render();window.scrollTo(0,0);}return;}
 if(a==='newMailTemplate'){if(leave()){panel={kind:'templates',row:{テンプレートID:'',分類:'その他',名称:'新しい文面',件名:'',本文:'',説明:'',対象:'',記録区分:'その他',有効:'true',並び順:200}};render();}return;}
 if(a==='mailTemplateSave'){if(!await save('mailTemplate',{row:{...panel.row,...rowForm()},base:panel.row.テンプレートID?panel.row:null}))return;panel={kind:'templates',row:mailList()[0]};render();return;}
 if(a==='mailSettings'){if(leave()){panel={kind:'mailSettings'};render();}return;}
 if(a==='mailSettingsSave'){if(!await save('mailSettings',{values:rowForm(),base:S.設定.filter(r=>r.項目.startsWith('メール:'))}))return;panel={kind:'templates',row:mailList()[0]};render();return;}
 if(a==='mail'){if(dirty){toast('入力中の内容を先に保存してください。');return;}await openMail(id);return;}
 if(a==='interviewMail'){const id=panel.row.人ID;if(await saveInterview(false))await openMail(id);return;}
 if(a==='mailBack'){const pid=id||panel.id;if(leave()){panel={kind:'person',id:pid,row:structuredClone(person(pid))};render();}return;}
 if(a==='mailRebuild'){const id=panel.id,tid=panel.mail.template.テンプレートID;if(!dirty||confirm('今回の文面を最新の記録で作り直しますか？')){S=await request('load');await openMail(id,tid);}return;}
 if(a==='mailApply'){const f=rowForm(),m=panel.mail,prev=panel.generated||{mailSubject:m.subject,mailBody:m.body};if(['mailSubject','mailBody'].some(k=>f[k]!==prev[k])&&!confirm('本文・件名の手入力を置き換え、差し替え項目から文面を作り直しますか？'))return;const next={mailSubject:m.subject,mailBody:m.body};for(const k of mailKeys(m.subject+'\n'+m.body)){const v=f['mailVar:'+k];if(v?.trim())for(const part of ['mailSubject','mailBody'])next[part]=next[part].split('{{'+k+'}}').join(v.trim());}for(const part of ['mailSubject','mailBody'])$('[name="'+part+'"]').value=next[part];panel.generated=next;panel.valuesDirty=false;$('[name="mailConfirmed"]').checked=false;dirty=true;refreshMail();return;}
 if(a==='mailCopy'){await copyMail(btn.dataset.part);return;}
 if(a==='mailRecordSave'){await recordMail();return;}
 if(a==='mailHistory'){if(leave()){panel={kind:'mailHistory',row:get('連絡記録','連絡ID',id)};render();window.scrollTo(0,0);}return;}
 if(a==='individualPrint'){individualSchedulePrint(id);return;}

 if(a==='reload'){if(leave())await load();return;}
 if(a==='nav'){if(leave()){tab=btn.dataset.tab;render();}return;}
 if(a==='close'){if(leave())render();return;}
 if(['prev','next'].includes(a)){if(leave()){day=plus(day,a==='prev'?-1:1);render();}return;}
 if(a==='hired'){if(leave()){filter='採用';contactFilter='all';query='';render();}return;}
 if(a==='contactFilter'){if(leave()){contactFilter=btn.dataset.filter;filter='all';query='';render();}return;}
 if(a==='contact'){if(leave()){panel={kind:'contact',id,row:structuredClone(person(id))};render();}return;}
 if(a==='contactSave'){const row={...panel.row,...rowForm()};if(['連絡済み','追加連絡不要'].includes(row.応募連絡状況))row.応募連絡対象日時=row.面接日時;await save('person',{row,base:panel.row});return;}
 if(a==='interview'){if(leave()){panel={kind:'interview',id,row:structuredClone(person(id)),step:0};render();window.scrollTo(0,0);}return;}
 if(a==='quickFee'){const f=$('#editor [name="交通費"]');if(f){f.value=btn.dataset.value;f.dispatchEvent(new Event('input',{bubbles:true}));f.dispatchEvent(new Event('change',{bubbles:true}));document.querySelectorAll('[data-action="quickFee"]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.value===f.value));}return;}
 if(a==='answersSize'){answersLarge=!answersLarge;try{localStorage.setItem('answersLarge',answersLarge?'1':'0');}catch(e){}$('.interview-source').classList.toggle('large',answersLarge);btn.textContent=answersLarge?'文字を戻す':'文字を大きく';btn.setAttribute('aria-pressed',answersLarge);return;}
 if(a==='interviewStep'){interviewDraft();panel.step=Number(btn.dataset.step);render();window.scrollTo(0,0);return;}
 if(a.startsWith('quickWish')){
  interviewDraft();const q=quickWishState();
  if(a==='quickWishSave'){await saveQuickWishes();return;}
  if(a==='quickWishRefresh'){saving=true;try{S=await request('load');q.base=structuredClone(S.勤務希望.filter(r=>r.人ID===panel.row.人ID));render();toast('勤務希望を読み直しました。面接の入力と選択した日は残っています。');}finally{saving=false;}return;}
  if(a==='quickWishBand')q.bandId=id;
  if(a==='quickWishStatus')q.status=btn.dataset.value;
  if(a==='quickWishMonth'){const d=new Date(q.month+'-01T00:00:00Z');d.setUTCMonth(d.getUTCMonth()+Number(btn.dataset.delta));q.month=d.toISOString().slice(0,7);}
  if(a==='quickWishAll'){q.selected=[...new Set([...q.selected,...quickWishMonthDays(q)])];dirty=true;}
  if(a==='quickWishClear')q.selected=[];
  refreshQuickWish();return;
 }
 if(a==='interviewSave'||a==='interviewComplete'){await saveInterview(a==='interviewComplete');return;}
 if(a==='interviewWishEdit'||a==='interviewWishNew'){if(manualWishChanged()&&!confirm('個別の勤務時間が未保存です。入力を破棄して別の日時を開きますか？'))return;interviewDraft();panel.manualBase=null;panel.manualWish=true;panel.wish=a==='interviewWishEdit'?structuredClone(get('勤務希望','希望ID',id)):null;['iwBand','iwDay','iwStart','iwEnd','iwStatus','iwNote'].forEach(k=>delete panel.draft[k]);render();return;}
 if(a==='interviewWishHide'){interviewDraft();panel.manualWish=false;render();return;}
 if(a==='interviewWishSave'){if(panel.quickWish?.selected.length)throw Error('先にチェックした日を保存するか、選択を外してください。');await saveManualWish();toast('勤務時間を保存しました。面接内容の保存状態は画面下で確認できます。');return;}
 if(a==='person'||a==='newPerson'){if(leave()){panel={kind:'person',id,row:a==='person'?structuredClone(person(id)):null};render();}return;}
 if(a==='personSave'){const r=withCodes({...(panel.row||{}),...rowForm()},['面接メモ','保護者学校確認']);await save('person',{row:r,base:panel.row});return;}
 if(a==='newWish'||a==='wish'){if(leave()){const r=a==='wish'?get('勤務希望','希望ID',id):null;panel={kind:'wish',row:r,personId:r?.人ID||id};render();}return;}
 if(a==='wishSave'){await save('wish',{row:{...panel.row,...rowForm(),人ID:panel.personId},base:panel.row});return;}
 if(a==='import'){await save('import',{});return;}
 if(a==='shiftVenue'){if(leave()){shiftVenueId=id;render();$('.sb-venue')?.scrollIntoView?.({block:'start'});}return;}
 if(a==='shiftList'){$('.sb-place-list')?.scrollIntoView?.({block:'start'});return;}
 if(['overview','seats','week'].includes(a)){if(leave()){view=a;render();}return;}
 if(a==='newDemand'||a==='demand'){if(leave()){panel={kind:'demand',row:a==='demand'?structuredClone(get('必要人数','枠ID',id)):null};render();}return;}
 if(a==='demandSave'){const r={...panel.row,...rowForm()};if(panel.row&&Number(r.人数)!==Number(panel.row.人数)&&!confirm('必要人数を変更します。配置済みの方はそのまま残ります。よろしいですか？'))return;await save('demand',{row:r,base:panel.row,confirm:true});return;}
 if(a==='candidate'){if(leave())await openCandidates(id,btn.dataset.person);return;}
 if(a==='assignSave'){await save('assign',{id:panel.row.枠ID,people:[...document.querySelectorAll('[name="people"]:checked')].map(x=>x.value),method:rowForm().method});return;}
 if(a==='placement'||a==='attendance'){if(leave()){panel={kind:a,row:structuredClone(get('配置','配置ID',id))};render();}return;}
 if(a==='placementSave'||a==='attendanceSave'){const f=rowForm();if(a==='placementSave')['休憩開始上書き','休憩終了上書き','休憩2開始上書き','休憩2終了上書き'].forEach(k=>{if(!f[k])f[k]='なし';});await save(a==='placementSave'?'placement':'attendance',{row:{...panel.row,...f},base:panel.row});return;}
 if(a==='cancelPlacement'){if(confirm('この配置を取り消しますか？'))await save('placement',{row:{...panel.row,状態:'取消'},base:panel.row});return;}
 if(a==='stamp'){if(leave()){panel={kind:'stamp',personId:btn.dataset.person,day:btn.dataset.day};render();}return;}
 if(a==='allPresent'){if(confirm('勤務が終了し、実績未入力の方を予定どおり出勤として記録しますか？'))await save('allPresent',{day});return;}
 if(a==='copySchedule'){await copySchedule(id);return;}
 if(a==='printDay'){dayPrint();return;}
 if(a==='receipt'){printHtml(receipt(get('支払','支払ID',id)));return;}
 if(a==='printAllPays'){printHtml(S.支払.filter(p=>!yes(p.支払済)).map(receipt).join(''));return;}
 if(a==='pay'){if(leave()){panel={kind:'pay',id};render();}return;}
 if(a==='payCalc'){const f=rowForm(),current=panel;saving=true;$('#busy').style.display='block';try{const result=await request('payPreview',{personId:current.id,date:f.date,other:f.other});if(panel!==current||rowForm().date!==f.date||rowForm().other!==f.other)throw Error('計算中に条件が変わりました。再計算してください。');calculation=result;dirty=false;render();}finally{saving=false;$('#busy').style.display='none';}return;}
 if(a==='paySave'){const f=rowForm();if(!calculation||f.date!==calculation.payDate||Number(f.other)!==Number(calculation.totals.other))throw Error('現在の条件で再計算してから確定してください。');await save('paySave',{personId:panel.id,date:calculation.payDate,other:calculation.totals.other,expected:calculation.totals,warningsConfirmed:f.warningsConfirmed==='on'});return;}
 if(a==='receive'||a==='correction'){if(leave()){panel={kind:a,row:get('支払','支払ID',id)};render();}return;}
 if(a==='receiveSave'){await save('payReceived',{id:panel.row.支払ID,received:rowForm().received==='on'});return;}
 if(a==='correctionSave'){const f=rowForm();await save('correction',{id:panel.row.支払ID,...f,reviewed:f.reviewed==='on'});return;}
 if(a==='settings'){if(leave()){panel={kind:'settings'};render();}return;}
 if(a==='issues'){if(leave()){panel={kind:'issues'};render();}return;}
 if(a==='settingEdit'||a==='newSetting'){if(leave()){const key=({設定:'項目',売場:'売場ID',勤務帯:'勤務帯ID'})[settingTable];panel={kind:'settingEdit',row:a==='settingEdit'?S[settingTable].find(r=>r[key]===id):null};render();}return;}
 if(a==='splitOpen'){if(dirty){toast('入力中の変更を先に保存してから、途中移動を開いてください。');return;}panel={kind:'splitPlacement',row:panel.row};render();return;}if(a==='splitSave'){await save('splitPlacement',{id:panel.row.配置ID,base:panel.row,...rowForm()});return;}
 if(['migrationImport','templateImport','pollForm'].includes(a)){if(confirm('設定した移行元から新しい台帳へ取り込みますか？'))await save(a,{});return;}if(a==='migrationPreview'){const r=await request(a);toast('応募者 '+r.count+'名、仮登録除外 '+r.excluded+'件（台帳ごとの合計）');return;}if(a==='settingSave'){await save('setting',{table:settingTable,row:{...panel.row,...rowForm()},base:panel.row});return;}
 }catch(e){error(e);}
});
window.addEventListener('beforeunload',e=>{if(dirty||saving||pendingRequests){e.preventDefault();e.returnValue='';}});
load();
</script></body></html>
