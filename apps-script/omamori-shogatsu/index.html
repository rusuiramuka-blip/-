<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --ink: #222; --sub: #666; --line: #ddd8cc;
    --main: #8c1c13; --main-ink: #fff; --ok: #2e6b3a; --warn: #a15c00; --mute: #888;
    --wait: #fff4d6; --ready: #e3f0ff; --done: #e5f4e8; --cancel: #eee;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 17px/1.5 "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--main); color: var(--main-ink); }
  header .top { display: flex; align-items: center; justify-content: space-between; padding: 8px 16px; }
  header h1 { font-size: 17px; margin: 0; }
  header .staff { font-size: 14px; background: rgba(255,255,255,.18); border: 0; color: inherit;
                  border-radius: 6px; padding: 4px 10px; }
  nav { display: flex; }
  nav button { flex: 1; padding: 10px 2px; border: 0; background: transparent; color: rgba(255,255,255,.75);
               font-size: 15px; border-bottom: 3px solid transparent; }
  nav button.on { color: #fff; border-bottom-color: #fff; font-weight: bold; }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  section { display: none; } section.on { display: block; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  label { display: block; font-size: 14px; color: var(--sub); margin: 10px 0 4px; }
  label .req { color: var(--main); }
  input, select, textarea { width: 100%; font-size: 17px; padding: 10px; border: 1px solid #bbb; border-radius: 8px; background: #fff; }
  input:focus, select:focus { outline: 2px solid var(--main); border-color: transparent; }
  .row { display: flex; gap: 8px; } .row > * { flex: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { border: 1px solid #bbb; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 15px; }
  .chip.on { background: var(--main); color: #fff; border-color: var(--main); }
  .btn { display: block; width: 100%; padding: 14px; font-size: 18px; font-weight: bold; border-radius: 10px;
         border: 0; background: var(--main); color: #fff; margin-top: 12px; }
  .btn.sub { background: #fff; color: var(--main); border: 2px solid var(--main); }
  .btn:disabled { opacity: .5; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .acts button { padding: 12px 6px; font-size: 16px; border-radius: 8px; border: 1px solid var(--line); background: #faf9f6; }
  .acts button.go { background: var(--ok); color: #fff; border-color: var(--ok); font-weight: bold; grid-column: 1 / -1; }
  .acts button.small { font-size: 14px; color: var(--sub); }
  .result { border: 1px solid var(--line); border-radius: 8px; max-height: 260px; overflow-y: auto; margin-top: 6px; background: #fff; }
  .result div { padding: 10px; border-bottom: 1px solid #eee; } .result div:last-child { border-bottom: 0; }
  .result small, .muted { color: var(--sub); font-size: 13px; }
  .cart-item { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid #eee; }
  .cart-item .nm { flex: 1; font-size: 15px; }
  .step { display: flex; align-items: center; }
  .step button { width: 40px; height: 40px; font-size: 20px; border: 1px solid #bbb; background: #fff; border-radius: 8px; }
  .step input { width: 56px; text-align: center; margin: 0 4px; padding: 8px 2px; }
  .x { border: 0; background: none; color: var(--mute); font-size: 22px; padding: 4px 8px; }
  .total { text-align: right; font-size: 18px; margin-top: 8px; }
  .badge { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 6px; margin-right: 4px; border: 1px solid transparent; }
  .b-wait { background: var(--wait); } .b-ready { background: var(--ready); } .b-done { background: var(--done); }
  .b-cancel { background: var(--cancel); color: var(--mute); } .b-unpaid { border-color: var(--warn); color: var(--warn); }
  .rsv h3 { margin: 0; font-size: 20px; } .rsv .no { font-size: 15px; color: var(--sub); }
  .rsv ul { margin: 8px 0 0; padding-left: 20px; } .rsv li.c { color: var(--mute); text-decoration: line-through; }
  .late { color: var(--main); font-weight: bold; }
  .big-no { font-size: 44px; font-weight: bold; text-align: center; letter-spacing: .05em; margin: 8px 0; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #222; color: #fff;
           padding: 12px 20px; border-radius: 10px; font-size: 16px; display: none; z-index: 20; max-width: 90%; }
  .toast.err { background: var(--main); }
  .count-item { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid #eee; }
  .count-item .nm { flex: 1; font-size: 15px; }
  .count-item.dirty { background: #fffbe6; }
  .sticky-save { position: sticky; bottom: 0; background: var(--bg); padding: 8px 0; }
  .loading { text-align: center; color: var(--sub); padding: 24px; }
  @media print {
    header, nav, .noprint, .toast { display: none !important; }
    body { background: #fff; } .card { border: 0; }
  }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title">正月のお守り</h1>
    <button class="staff" id="staffBtn" onclick="askStaff()">職員: 未設定</button>
  </div>
  <nav>
    <button data-tab="reg" class="on">① 受付</button>
    <button data-tab="find">② お渡し</button>
    <button data-tab="pick">取り分け表</button>
    <button data-tab="count">③ 残りを数える</button>
  </nav>
</header>

<main>
  <!-- ① 受付 -->
  <section id="tab-reg" class="on">
    <div id="regForm">
      <div class="card">
        <label>お名前 <span class="req">*</span></label>
        <input id="fName" autocomplete="off" placeholder="例：成田 花子">
        <div class="row">
          <div><label>電話番号</label><input id="fTel" type="tel" autocomplete="off"></div>
          <div><label>受取予定日</label><input id="fPickup" type="date"></div>
        </div>
        <label>お渡し場所</label>
        <div class="chips" id="fPlace"></div>
        <label>お支払い</label>
        <div class="chips" id="fPay"></div>
        <label>メモ</label>
        <input id="fNote" autocomplete="off" placeholder="名入れ・のし など">
      </div>

      <div class="card">
        <label>商品をさがす <span class="req">*</span></label>
        <input id="fSearch" autocomplete="off" placeholder="名前・カテゴリー・商品番号の一部">
        <div class="result" id="fResult" style="display:none"></div>
        <div id="cart"></div>
        <div class="total" id="cartTotal"></div>
      </div>
      <button class="btn" id="regBtn" onclick="register()">受付を登録する</button>
    </div>

    <div id="regDone" style="display:none">
      <div class="card" id="slip"></div>
      <div class="noprint">
        <button class="btn sub" onclick="window.print()">控えを印刷する</button>
        <button class="btn" onclick="resetForm()">次の方を受け付ける</button>
      </div>
    </div>
  </section>

  <!-- ② さがす・お渡し -->
  <section id="tab-find">
    <div class="card">
      <input id="qText" autocomplete="off" placeholder="お名前・電話番号・受付番号">
      <div class="chips" id="qFilter" style="margin-top:10px">
        <button class="chip on" data-f="active">お渡し前</button>
        <button class="chip" data-f="today">今日受取</button>
        <button class="chip" data-f="wait">まだ取り分けていない</button>
        <button class="chip" data-f="ready">取り分け済み</button>
        <button class="chip" data-f="done">お渡し済み</button>
        <button class="chip" data-f="all">すべて</button>
      </div>
    </div>
    <div id="findList"></div>
  </section>

  <!-- 取り分け表 -->
  <section id="tab-pick">
    <div class="card muted">まだ取り分けていない取り置きを、商品ごとに合計しています。品物を揃えたら「② お渡し」で受付ごとに「取り分けた」を押してください。</div>
    <div id="pickList"></div>
    <button class="btn sub noprint" onclick="window.print()">この表を印刷する</button>
  </section>

  <!-- ③ 残りを数える -->
  <section id="tab-count">
    <div class="card">
      <div class="muted">正月が終わったら、場所ごとに残っている数を入れます。ない場所も 0 を入れてください（3か所そろうと、お渡しした数が自動で出ます）。</div>
      <label>数える場所</label>
      <div class="chips" id="cPlace"></div>
      <label>しぼりこみ</label>
      <input id="cSearch" autocomplete="off" placeholder="商品名の一部">
    </div>
    <div class="card" id="countList"></div>
    <div class="sticky-save noprint">
      <button class="btn" id="countSaveBtn" onclick="saveCounts()">この場所の残数を保存する</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
const SITE = <?!= JSON.stringify(siteKey) ?>;
let CFG = null;
let cart = [];
let token = newToken();
let form = { place: '', pay: '' };
let filter = 'active';
let countPlace = 0, countRows = [], countDirty = {};

// ---------- 共通
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const yen = n => (typeof n === 'number' ? n.toLocaleString('ja-JP') + '円' : '');
function newToken() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 10); }
function norm(s) {
  return String(s || '').normalize('NFKC').toLowerCase()
    .replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60))
    .replace(/[\s　]/g, '');
}
function toast(msg, err) {
  const t = $('toast'); t.textContent = msg; t.className = 'toast' + (err ? ' err' : '');
  t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', err ? 6000 : 2500);
}
function call(fn, ...args) {
  return new Promise((ok, ng) => google.script.run.withSuccessHandler(ok)
    .withFailureHandler(e => { toast(e.message || String(e), true); ng(e); })[fn](SITE, ...args));
}
function staff() { try { return localStorage.getItem('omamori.staff') || ''; } catch (e) { return window._staff || ''; } }
function askStaff() {
  const v = prompt('あなたの名前（受付した職員として記録します）', staff());
  if (v === null) return;
  try { localStorage.setItem('omamori.staff', v.trim()); } catch (e) { window._staff = v.trim(); }
  showStaff();
}
function showStaff() { $('staffBtn').textContent = '職員: ' + (staff() || '未設定'); }
function needStaff() { if (!staff()) askStaff(); return !!staff(); }
function chips(el, list, cur, onPick) {
  el.innerHTML = list.map(v => '<button class="chip' + (v === cur ? ' on' : '') + '" data-v="' + esc(v) + '">' + esc(v) + '</button>').join('');
  el.onclick = e => { const b = e.target.closest('button'); if (!b) return; onPick(b.dataset.v); chips(el, list, b.dataset.v, onPick); };
}

// ---------- タブ
document.querySelectorAll('nav button').forEach(b => b.onclick = () => {
  document.querySelectorAll('nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('section').forEach(s => s.classList.toggle('on', s.id === 'tab-' + b.dataset.tab));
  if (b.dataset.tab === 'find') loadFind();
  if (b.dataset.tab === 'pick') loadPick();
  if (b.dataset.tab === 'count') loadCount();
});

// ---------- ① 受付
function resetForm() {
  cart = []; token = newToken();
  ['fName', 'fTel', 'fNote', 'fSearch'].forEach(id => $(id).value = '');
  $('fPickup').value = CFG.defaultPickup;
  form.place = CFG.places[0]; form.pay = CFG.pay.ON_PICKUP;
  chips($('fPlace'), CFG.places, form.place, v => form.place = v);
  const pays = [CFG.pay.ON_PICKUP, CFG.pay.PAID, CFG.pay.UNPAID, CFG.pay.FREE];
  chips($('fPay'), pays, form.pay, v => form.pay = v);
  $('fResult').style.display = 'none';
  $('regForm').style.display = ''; $('regDone').style.display = 'none';
  drawCart(); $('fName').focus();
}
$('fSearch').oninput = () => {
  const q = norm($('fSearch').value), box = $('fResult');
  if (!q) { box.style.display = 'none'; return; }
  const hit = CFG.products.filter(p => p._k.indexOf(q) >= 0).slice(0, 30);
  box.innerHTML = hit.length ? hit.map(p =>
    '<div data-id="' + esc(p.id) + '"><b>' + esc(p.name) + '</b><br><small>' + esc(p.category) + '・' + esc(p.id) +
    (p.price != null ? '・' + yen(p.price) : '') + (p.newYear ? '' : '・正月対象外') + '</small></div>').join('')
    : '<div class="muted">見つかりません</div>';
  box.style.display = 'block';
};
$('fResult').onclick = e => {
  const d = e.target.closest('[data-id]'); if (!d) return;
  const p = CFG.products.find(x => x.id === d.dataset.id);
  const ex = cart.find(c => c.id === p.id);
  if (ex) ex.qty++; else cart.push({ id: p.id, name: p.name, price: p.price, qty: 1 });
  $('fSearch').value = ''; $('fResult').style.display = 'none'; drawCart();
};
function drawCart() {
  $('cart').innerHTML = cart.map((c, i) =>
    '<div class="cart-item"><div class="nm">' + esc(c.name) + '<br><small class="muted">' + yen(c.price) + '</small></div>' +
    '<div class="step"><button onclick="qty(' + i + ',-1)">−</button><input type="number" min="1" value="' + c.qty +
    '" onchange="qtySet(' + i + ',this.value)"><button onclick="qty(' + i + ',1)">＋</button></div>' +
    '<button class="x" onclick="cart.splice(' + i + ',1);drawCart()" aria-label="削除">×</button></div>').join('');
  const sum = cart.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
  $('cartTotal').textContent = cart.length ? '合計 ' + yen(sum) : '';
}
function qty(i, d) { cart[i].qty = Math.max(1, cart[i].qty + d); drawCart(); }
function qtySet(i, v) { cart[i].qty = Math.max(1, parseInt(v, 10) || 1); drawCart(); }

async function register() {
  if (!needStaff()) return;
  if (!$('fName').value.trim()) { toast('お名前を入力してください', true); $('fName').focus(); return; }
  if (!cart.length) { toast('商品を選んでください', true); $('fSearch').focus(); return; }
  const btn = $('regBtn'); btn.disabled = true; btn.textContent = '登録しています…';
  const p = {
    token, name: $('fName').value, tel: $('fTel').value, pickup: $('fPickup').value,
    place: form.place, pay: form.pay, note: $('fNote').value, staff: staff(),
    items: cart.map(c => ({ id: c.id, qty: c.qty }))
  };
  try {
    const r = await call('apiRegister', p);
    const sum = cart.reduce((s, c) => s + (c.price || 0) * c.qty, 0);
    $('slip').innerHTML =
      '<div class="muted" style="text-align:center">取り置き 受付番号</div><div class="big-no">' + esc(r.no) + '</div>' +
      '<h3 style="text-align:center;margin:0">' + esc(p.name) + ' 様</h3>' +
      '<p style="text-align:center">受取予定 ' + esc(p.pickup || '未定') + '・' + esc(p.place) + '・' + esc(p.pay) + '</p>' +
      '<ul>' + cart.map(c => '<li>' + esc(c.name) + ' × ' + c.qty + '</li>').join('') + '</ul>' +
      '<div class="total">合計 ' + yen(sum) + '</div>' +
      (r.duplicated ? '<p class="late">※ すでに登録済みの受付です（二重登録はしていません）</p>' : '') +
      (r.warning ? '<p class="late">' + esc(r.warning) + '</p>' : '');
    $('regForm').style.display = 'none'; $('regDone').style.display = '';
    window.scrollTo(0, 0);
  } finally {
    btn.disabled = false; btn.textContent = '受付を登録する';
  }
}

// ---------- ② さがす・お渡し
let findTimer = null;
$('qText').oninput = () => { clearTimeout(findTimer); findTimer = setTimeout(loadFind, 350); };
$('qFilter').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#qFilter .chip').forEach(x => x.classList.toggle('on', x === b));
  loadFind();
};
async function loadFind() {
  $('findList').innerHTML = '<div class="loading">読み込み中…</div>';
  const list = await call('apiSearch', $('qText').value, filter);
  $('findList').innerHTML = list.length ? list.map(rsvCard).join('') : '<div class="card muted">該当する取り置きはありません。</div>';
}
function rsvCard(g) {
  const S = CFG.state, P = CFG.pay;
  const label = { wait: ['まだ取り分けていない', 'b-wait'], ready: ['取り分け済み', 'b-ready'], done: ['お渡し済み', 'b-done'], cancel: ['取消', 'b-cancel'] }[g.summary];
  const unpaid = g.pay === P.UNPAID || g.pay === P.ON_PICKUP;
  const late = g.pickup && g.pickup < CFG.today && (g.summary === 'wait' || g.summary === 'ready');
  const no = esc(g.no).replace(/'/g, '');
  let acts = '';
  if (g.summary === 'wait') acts += '<button class="go" onclick="act(\'' + no + '\',\'ready\')">品物を取り分けた</button>';
  if (g.summary === 'ready' || g.summary === 'wait') acts += '<button class="go" onclick="act(\'' + no + '\',\'handover\',' + (unpaid ? g.total : -1) + ')">' + (unpaid ? '代金を受け取って お渡しした' : 'お渡しした') + '</button>';
  if (unpaid && g.summary !== 'cancel') acts += '<button onclick="act(\'' + no + '\',\'paid\')">代金だけ先に受け取った</button>';
  if (g.summary === 'wait' || g.summary === 'ready') acts += '<button onclick="act(\'' + no + '\',\'cancel\')">取り消す</button>';
  if (g.summary !== 'wait') acts += '<button class="small" onclick="act(\'' + no + '\',\'undo\')">ひとつ前に戻す</button>';
  return '<div class="card rsv"><div class="no">' + esc(g.no) + '</div><h3>' + esc(g.name) + ' 様</h3>' +
    '<div><span class="badge ' + label[1] + '">' + label[0] + '</span><span class="badge ' + (unpaid ? 'b-unpaid' : 'b-done') + '">' + esc(g.pay) + '</span></div>' +
    '<div class="muted">受取予定 <span class="' + (late ? 'late' : '') + '">' + esc(g.pickup || '未定') + (late ? '（過ぎています）' : '') + '</span>・' + esc(g.place) +
    (g.tel ? '・☎ ' + esc(g.tel) : '') + (g.handed ? '・お渡し ' + esc(g.handed) : '') + '</div>' +
    '<ul>' + g.items.map(it => '<li class="' + (it.state === S.CANCEL ? 'c' : '') + '">' + esc(it.item.replace(/^[^｜]*｜/, '')) + ' × ' + esc(it.qty) + '</li>').join('') + '</ul>' +
    '<div class="total">合計 ' + yen(g.total) + '</div>' + (g.note ? '<div class="muted">メモ: ' + esc(g.note) + '</div>' : '') +
    '<div class="acts noprint">' + acts + '</div></div>';
}
async function act(no, action, amount) {
  if (!needStaff()) return;
  const msg = {
    ready: '品物を袋に取り分けましたか？\n（袋にお名前と受付番号 ' + no + ' を書いてください）',
    handover: amount >= 0 ? '代金 ' + yen(amount) + ' を受け取り、お渡ししましたか？' : 'お渡ししましたか？',
    paid: '代金を受け取りましたか？', cancel: 'この取り置きを取り消しますか？\n取り分けた品物は正月の売場へ戻してください。',
    undo: 'ひとつ前の状態に戻しますか？'
  }[action];
  if (!confirm(msg)) return;
  await call('apiAct', no, action, staff());
  toast('記録しました'); loadFind();
}

// ---------- 取り分け表
async function loadPick() {
  $('pickList').innerHTML = '<div class="loading">読み込み中…</div>';
  const list = await call('apiPickList');
  $('pickList').innerHTML = list.length ? '<div class="card">' + list.map(x =>
    '<div class="cart-item"><div class="nm"><b>' + esc(x.item.replace(/^[^｜]*｜/, '')) + '</b><br><small class="muted">' + x.people.map(esc).join('<br>') + '</small></div>' +
    '<div style="font-size:24px;font-weight:bold">' + x.qty + '</div></div>').join('') + '</div>'
    : '<div class="card muted">取り分けを待っている取り置きはありません。</div>';
}

// ---------- ③ 残りを数える
async function loadCount() {
  const pickPlace = v => {
    if (Object.keys(countDirty).length && !confirm('保存していない数があります。破棄して場所を切り替えますか？')) {
      setTimeout(() => chips($('cPlace'), CFG.countPlaces, CFG.countPlaces[countPlace], pickPlace)); return;
    }
    countPlace = CFG.countPlaces.indexOf(v); countDirty = {}; drawCount();
  };
  chips($('cPlace'), CFG.countPlaces, CFG.countPlaces[countPlace], pickPlace);
  $('countList').innerHTML = '<div class="loading">読み込み中…</div>';
  countRows = await call('apiCountLoad'); countDirty = {}; drawCount();
}
$('cSearch').oninput = () => drawCount();
function drawCount() {
  const q = norm($('cSearch').value);
  const rows = countRows.filter(r => !q || norm(r.name + r.category + r.id).indexOf(q) >= 0);
  const done = countRows.filter(r => r.left[countPlace] !== '').length;
  $('countList').innerHTML = '<div class="muted">入力済み ' + done + ' / ' + countRows.length + ' 品</div>' + rows.map(r => {
    const v = r.row in countDirty ? countDirty[r.row] : r.left[countPlace];
    const hint = countPlace === 2 && r.holdHint ? '<br><small class="late">未受取の取り置き ' + r.holdHint + ' 個</small>' : '';
    return '<div class="count-item' + (r.row in countDirty ? ' dirty' : '') + '"><div class="nm">' + esc(r.name) +
      '<br><small class="muted">準備 ' + esc(r.prepared) + '・' + esc(r.status) + '</small>' + hint + '</div>' +
      '<div class="step"><button onclick="cStep(' + r.row + ',-1)">−</button><input type="number" min="0" inputmode="numeric" value="' + esc(v) +
      '" onchange="cSet(' + r.row + ',this.value)"><button onclick="cStep(' + r.row + ',1)">＋</button></div></div>';
  }).join('');
}
function cCur(row) { const r = countRows.find(x => x.row === row); return row in countDirty ? countDirty[row] : r.left[countPlace]; }
function cStep(row, d) { const c = cCur(row); countDirty[row] = Math.max(0, (c === '' ? 0 : c) + d); drawCount(); }
function cSet(row, v) { countDirty[row] = v === '' ? '' : Math.max(0, parseInt(v, 10) || 0); drawCount(); }
async function saveCounts() {
  const rows = Object.keys(countDirty).map(Number);
  if (!rows.length) { toast('変更はありません'); return; }
  const btn = $('countSaveBtn'); btn.disabled = true;
  try {
    const counts = rows.map(row => ({ row, id: countRows.find(x => x.row === row).id, value: countDirty[row] }));
    const r = await call('apiCountSave', countPlace, counts);
    toast(CFG.countPlaces[countPlace] + ' の残数を ' + r.saved + ' 件保存しました');
    countRows = await call('apiCountLoad'); countDirty = {}; drawCount();
  } finally { btn.disabled = false; }
}

// ---------- 起動
(async function () {
  showStaff();
  CFG = await call('apiInit');
  CFG.products.forEach(p => p._k = norm(p.name + p.category + p.id));
  $('title').textContent = '正月のお守り（' + CFG.label + '）';
  resetForm();
})();
</script>
